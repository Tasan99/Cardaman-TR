services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: regchain
      POSTGRES_USER: regchain_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U regchain_owner -d regchain"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: ./backend
    command: [python, -m, regchain.migrate]
    environment:
      DATABASE_URL: postgresql://regchain_owner:${POSTGRES_PASSWORD}@db:5432/regchain
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set application password}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:-local-ingest-change-me}
      EXTRACT_DB_PASSWORD: ${EXTRACT_DB_PASSWORD:-local-extract-change-me}
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set non-owner application database URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
  ingest:
    build: ./backend
    profiles: [ingest]
    entrypoint: [python, -m, regchain.ingestion.cli]
    command: [sync]
    environment:
      PGHOST: db
      PGDATABASE: regchain
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:-local-ingest-change-me}
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      migrate:
        condition: service_completed_successfully
  extract:
    build: ./backend
    profiles: [extract]
    entrypoint: [python, -m, regchain.extraction.cli]
    command: [latest]
    environment:
      PGHOST: db
      PGDATABASE: regchain
      EXTRACT_DB_PASSWORD: ${EXTRACT_DB_PASSWORD:-local-extract-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODEL_DIGEST: ${LLM_MODEL_DIGEST:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      LLM_THINKING: ${LLM_THINKING:-}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      migrate:
        condition: service_completed_successfully
  db-test:
    # Separate disposable database: extraction tests never touch the application DB.
    image: pgvector/pgvector:pg17
    profiles: [test]
    environment:
      POSTGRES_DB: regchain_test
      POSTGRES_USER: regchain_test_owner
      POSTGRES_PASSWORD: disposable-test-only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U regchain_test_owner -d regchain_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  test:
    build: ./backend
    profiles: [test]
    command: [python, -m, unittest, discover, -s, tests, -v]
    environment:
      TEST_DATABASE_URL: postgresql://regchain_test_owner:disposable-test-only@db-test:5432/regchain_test
    depends_on:
      db-test:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
